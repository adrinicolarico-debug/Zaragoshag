<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera web</title>
  <style>
    :root {
      --fondo: #0f172a;
      --panel: #1e293b;
      --texto: #f8fafc;
      --suave: #cbd5e1;
      --acento: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e3a5f, var(--fondo) 60%);
      color: var(--texto);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 720px);
      text-align: center;
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 24px;
      padding: clamp(28px, 6vw, 56px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
    }

    .etiqueta {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--acento);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 22px 0 14px;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      line-height: 1.05;
    }

    p {
      color: var(--suave);
      font-size: 1.08rem;
      line-height: 1.7;
    }

    button {
      margin-top: 18px;
      padding: 13px 22px;
      border: 0;
      border-radius: 12px;
      background: var(--acento);
      color: #082f49;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    #mensaje {
      min-height: 1.7em;
      margin-top: 18px;
      color: #7dd3fc;
      font-weight: 600;
    }

    footer {
      margin-top: 34px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="etiqueta">MI PRIMER PROYECTO</span>
    <h1>¡Hola, internet! 👋</h1>
    <p>
      Esta es mi primera página web. La estoy creando con HTML y CSS
      y pronto estará publicada en GitHub Pages.
    </p>

    <button id="boton">Haz clic aquí</button>
    <div id="mensaje" aria-live="polite"></div>

    <footer>Hecha por mí · 2026</footer>
  </main>

  <script>
    const boton = document.getElementById("boton");
    const mensaje = document.getElementById("mensaje");
    let clics = 0;

    boton.addEventListener("click", () => {
      clics++;
      mensaje.textContent = `¡Funciona! Has pulsado el botón ${clics} vez/veces.`;
    });
  </script>
</body>
</html>
